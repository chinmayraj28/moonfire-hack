name: Subtext
options:
  bundleIdPrefix: com.owenbarnes
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  Subtext:
    type: application
    platform: macOS
    sources:
      - Subtext
    info:
      path: Subtext/Info.plist
      properties:
        CFBundleDisplayName: Subtext
        CFBundleShortVersionString: "1.0"
        LSApplicationCategoryType: public.app-category.social-networking
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.owenbarnes.subtext
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        MTL_FAST_MATH: YES
    postBuildScripts:
      - name: Copy iMessage sounds from this Mac
        basedOnDependencyAnalysis: false
        script: |
          # Apple's own sounds are copied from this Mac at build time, never committed.
          dest="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          ui=$(ls -d /Library/Developer/CoreSimulator/Volumes/*/Library/Developer/CoreSimulator/Profiles/Runtimes/*.simruntime/Contents/Resources/RuntimeRoot/System/Library/Audio/UISounds 2>/dev/null | tail -1)
          for f in ReceivedMessage.caf SentMessage.caf sms-received1.caf; do
            if [ -n "$ui" ] && [ -f "$ui/$f" ]; then cp "$ui/$f" "$dest/"; fi
          done
          mac=/System/Library/Components/CoreAudio.component/Contents/SharedSupport/SystemSounds/system/SentMessage.caf
          if [ ! -f "$dest/SentMessage.caf" ] && [ -f "$mac" ]; then cp "$mac" "$dest/"; fi
          exit 0
    scheme:
      environmentVariables:
        SUBTEXT_URL: http://127.0.0.1:8080/v1/chat/completions
        SUBTEXT_BASE_URL: http://127.0.0.1:8081/v1/chat/completions
